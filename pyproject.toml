[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tplinkrouterc6u"
requires-python = ">=3.10"
# setup.py stays the source of truth for the package metadata.
dynamic = ["version", "description", "readme", "authors", "urls", "classifiers", "dependencies"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "flake8>=7.3",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# Some test modules import siblings as top-level modules (e.g. `from test_client_c6u import ...`).
pythonpath = ["test"]
markers = [
    "live: talks to a real router; skipped unless TPLINK_HOST and TPLINK_PASSWORD are set",
]
